name: Build ModiCube 

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: linux
            make_cmd: make linux RELEASE=1 -j$(nproc)
            artifact_name: ModiCube-Linux-x86_64
            binary: ModiCube

          - name: Windows (64-bit)
            os: ubuntu-latest
            target: mingw-64
            make_cmd: make mingw CC=x86_64-w64-mingw32-gcc RELEASE=1 -j$(nproc)
            artifact_name: ModiCube-Windows-x86_64
            binary: ModiCube.exe

          - name: Windows (32-bit)
            os: ubuntu-latest
            target: mingw-32
            make_cmd: make mingw CC=i686-w64-mingw32-gcc RELEASE=1 -j$(nproc)
            artifact_name: ModiCube-Windows-i686
            binary: ModiCube.exe

          - name: macOS (Intel/Universal)
            os: macos-latest
            target: darwin
            make_cmd: make darwin RELEASE=1 -j$(sysctl -n hw.ncpu)
            artifact_name: ModiCube-macOS
            binary: ModiCube.app

          - name: Raspberry Pi
            os: ubuntu-latest
            target: rpi
            make_cmd: make rpi RELEASE=1 -j$(nproc)
            artifact_name: ModiCube-RaspberryPi
            binary: ModiCube

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux / Cross-compilers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libopenal-dev \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686

      - name: Fix Makefile Formatting & Syntax Bugs
        run: |
          python3 -c "
          with open('Makefile', 'r', encoding='utf-8') as f:
              content = f.read()
          # Remove non-breaking spaces hidden in copy-paste
          content = content.replace('\xa0', ' ')
          # Fix Makefile bug where ifndef uses a dollar sign
          content = content.replace('ifndef \$(PLAT)', 'ifndef PLAT')
          with open('Makefile', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Build ModiCube
        run: |
          echo "Running build command: ${{ matrix.platform.make_cmd }}"
          ${{ matrix.platform.make_cmd }}

      - name: Prepare Artifact Directory
        run: |
          mkdir -p build-output
          if [ "${{ matrix.platform.target }}" = "darwin" ]; then
            zip -r build-output/ModiCube-macOS.zip ModiCube.app
          else
            cp ${{ matrix.platform.binary }} build-output/
          fi

      - name: Compress to Zip (Non-macOS)
        if: matrix.platform.target != 'darwin'
        uses: vimtor/action-zip@v1.2
        with:
          files: build-output/${{ matrix.platform.binary }}
          dest: ${{ matrix.platform.artifact_name }}.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            ${{ matrix.platform.artifact_name }}.zip
            build-output/ModiCube-macOS.zip
          if-no-files-found: ignore
